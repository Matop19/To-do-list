<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>To-Do List</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f9;
      height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .container {
	  width: 320px;
	  background: white;
	  padding: 20px;
	  border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
	  text-align: center;
	}
    h1 {
	  margin-bottom: 20px;
	  color: #333;
	}
    input, button {
      width: 90%;
	  padding: 10px;
	  margin: 5px 0;
	  border-radius: 4px;
      border: 1px solid #ccc;
    }
    button {
      background-color: #007bff;
	  color: white;
	  border: none;
	  cursor: pointer;
    }
    button:hover {
	  background-color: #0056b3;
	}
    ul {
      list-style: none;
	  padding: 0;
	  text-align: left;
      max-height: 300px;
	  overflow-y: auto;
	  word-break: break-word;
    }
    li {
      background: #f9f9f9;
	  padding: 10px;
	  border: 1px solid #ddd;
      margin: 5px 0;
	  border-radius: 4px;
	  display: flex;
	  justify-content: space-between;
	  gap: 10px;
    }
    li.completed span {
	  text-decoration: line-through;
	  color: #888;
	}
    .delete-btn {
	  font-size: 11px;
      background: #ff4d4d;
	  color: white;
	  border: none;
	  padding: 5px 10px;
      border-radius:4px;
	  cursor: pointer;
	  min-width:50px;
	  max-width:75px;
	  max-height:30px;
    }
    .delete-btn:hover {
	  background: #cc0000;
	}
	.modif-btn {
	  font-size: 11px;
      background: #27B744;
	  color: white;
	  border: none;
	  padding: 5px 10px;
      border-radius:4px;
	  cursor: pointer;
	  min-width:50px;
	  max-width:60px;
	  max-height:30px;
    }
    .modif-btn:hover {
	  background: #00cc00;
	}
    #message {
	  color: red; margin: 5px 0;
	}
  </style>
</head>
<body>
  <div class="container" id="authContainer">
    <h1>Connexion</h1>
    <input type="email" id="email" placeholder="Email" />
    <input type="password" id="password" placeholder="Mot de passe" />
	<input type="text" id="registerUsername" placeholder="Nom d'utilisateur (inscription uniquement)" />
    <button onclick="register()">Créer un compte</button>
    <button onclick="login()">Se connecter</button>
    <p id="message"></p>
  </div>

  <div class="container" id="todoContainer" style="display: none;">
    <h1>To-Do List</h1>
    <p id="welcome"></p>
    <input type="text" id="taskInput" placeholder="Ajouter une tâche..." />
    <button id="addTaskBtn">Ajouter</button>
    <input type="text" id="searchInput" placeholder="Rechercher une tâche..." />
    <ul id="taskList"></ul>
    <button onclick="logout()">Se déconnecter</button>
  </div>
  <script>
    const supabaseUrl = 'https://xtnybqqgiftasikzgcos.supabase.co';
    const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh0bnlicXFnaWZ0YXNpa3pnY29zIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTEzNjQxNTksImV4cCI6MjA2Njk0MDE1OX0.OLkZI-KafGoLiJHmVwwDWQLBIG6IsJfFIXZHdUxwx68";
    const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

    let currentUser = null;
    const taskList = document.getElementById('taskList');
	supabase.auth.onAuthStateChange((event, session) => {
	  console.log("Auth event:", event, session);
	});

    function showMessage(msg, color = "red") {
      const msgEl = document.getElementById("message");
      msgEl.textContent = msg;
      msgEl.style.color = color;
    }

    async function register() {
	  const email = document.getElementById("email").value.trim();
	  const password = document.getElementById("password").value;
	  const username = document.getElementById("registerUsername").value.trim();

	  if (!email || !password || !username) return showMessage("Tous les champs sont requis");

	  const { data: existingUser, error: existingUserError } = await supabase
		.from("profiles")
		.select("*")
		.eq("username", username)
		.single();

	  if (existingUser) return showMessage("Nom d'utilisateur déjà utilisé");

	  const { data, error } = await supabase.auth.signUp({
		email,
		password,
	  });

	  if (error) return showMessage(error.message);

	  const userId = data.user.id;

	  const { error: profileError } = await supabase
		.from("profiles")
		.insert([{ id: userId, username }]);

	  if (profileError) return showMessage("Erreur lors de la création du profil");

	  showMessage("Compte créé ! Vérifiez votre e-mail.", "green");
	}

    async function login() {
	  const email = document.getElementById("email").value.trim();
	  const password = document.getElementById("password").value;

	  const { data, error } = await supabase.auth.signInWithPassword({ email, password });
	  if (error) return showMessage("Identifiants invalides");

	  currentUser = data.user;

	  const { data: profileData, error: profileError } = await supabase
		.from("profiles")
		.select("username")
		.eq("id", currentUser.id)
		.single();

	  const username = profileData?.username || currentUser.email;

	  document.getElementById("authContainer").style.display = "none";
	  document.getElementById("todoContainer").style.display = "block";
	  document.getElementById("welcome").textContent = "Bienvenue, " + username;

	  loadTasks();
	}
    async function logout() {
      await supabase.auth.signOut();
      currentUser = null;
      document.getElementById("authContainer").style.display = "block";
      document.getElementById("todoContainer").style.display = "none";
      taskList.innerHTML = '';
      document.getElementById("username").value = '';
      document.getElementById("password").value = '';
      showMessage("");
    }

    async function addTask(text, completed = false, id = null) {
	  const li = document.createElement('li');
	  const textSpan = document.createElement('span');
	  textSpan.textContent = text;
	  li.appendChild(textSpan);
	  if (completed) li.classList.add('completed');

	  li.addEventListener('click', async () => {
		if (event.target.tagName === 'BUTTON' || event.target.tagName === 'INPUT') return;
		const newStatus = !li.classList.contains('completed');
		li.classList.toggle('completed');
		if (id) await supabase.from("tasks").update({ completed: newStatus }).eq("id", id);
	  });

	  const deleteBtn = document.createElement('button');
	  deleteBtn.textContent = 'Supprimer';
	  deleteBtn.classList.add('delete-btn');
	  deleteBtn.addEventListener('click', async (e) => {
		e.stopPropagation();
		li.remove();
		if (id) await supabase.from("tasks").delete().eq("id", id);
	  });

	  const editBtn = document.createElement('button');
	  editBtn.textContent = 'Modifier';
	  editBtn.classList.add('modif-btn');
	  editBtn.addEventListener('click', (e) => {
		e.stopPropagation();

		const input = document.createElement('input');
		input.type = 'text';
		input.value = textSpan.textContent;
		li.insertBefore(input, textSpan);
		li.removeChild(textSpan);

		editBtn.style.display = 'none';

		const saveBtn = document.createElement('button');
		saveBtn.textContent = 'Valider';
		saveBtn.classList.add('modif-btn');
		li.insertBefore(saveBtn, deleteBtn);

		saveBtn.addEventListener('click', async (e) => {
		  e.stopPropagation();
		  const newText = input.value.trim();
		  if (!newText) return;

		  if (id) {
			await supabase.from("tasks").update({ text: newText }).eq("id", id);
		  }

		  textSpan.textContent = newText;
		  li.insertBefore(textSpan, input);
		  li.removeChild(input);
		  li.removeChild(saveBtn);
		  editBtn.style.display = '';
		});
	  });

	  li.appendChild(editBtn);
	  li.appendChild(deleteBtn);
	  taskList.appendChild(li);

	  if (!id) {
		const { data } = await supabase
		  .from("tasks")
		  .insert([{ text, completed, user_id: currentUser.id }])
		  .select();
		id = data[0].id;
	  }
	}

    async function loadTasks() {
      const { data, error } = await supabase
        .from("tasks")
        .select("*")
        .eq("user_id", currentUser.id);
      if (error) return showMessage("Erreur lors du chargement");
      taskList.innerHTML = '';
      data.forEach(task => addTask(task.text, task.completed, task.id));
    }

    document.getElementById('addTaskBtn').addEventListener('click', () => {
      const taskInput = document.getElementById('taskInput');
      const text = taskInput.value.trim();
      if (!text) return;
      addTask(text);
      taskInput.value = '';
    });

    document.getElementById('searchInput').addEventListener('input', (e) => {
      const query = e.target.value.toLowerCase();
      document.querySelectorAll('#taskList li').forEach(li => {
        const text = li.firstChild.textContent.toLowerCase();
        li.style.display = text.includes(query) ? '' : 'none';
      });
    });
  </script>
</body>
</html>
