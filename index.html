<body>
  <div class="container" id="authContainer">
    <h1>Connexion</h1>
    <input type="text" id="username" placeholder="Nom d'utilisateur" />
    <input type="password" id="password" placeholder="Mot de passe" />
    <button onclick="register()">Créer un compte</button>
    <button onclick="login()">Se connecter</button>
    <p id="message"></p>
  </div>
  <div class="container" id="todoContainer" style="display: none;">
    <h1>To-Do List</h1>
    <p id="welcome"></p>
    <input type="text" id="taskInput" placeholder="Ajouter une tâche..." />
    <button id="addTaskBtn">Ajouter</button>
    <input type="text" id="searchInput" placeholder="Rechercher une tâche..." />
    <ul id="taskList"></ul>
    <button onclick="logout()">Se déconnecter</button>
  </div>
  <script>
    let currentUser = null;
    function showMessage(msg, color = "red") {
      const msgEl = document.getElementById("message");
      msgEl.textContent = msg;
      msgEl.style.color = color;
    }
    function getUserData(username) {
      const data = localStorage.getItem(`user_${username}`);
      return data ? JSON.parse(data) : null;
    }
    function saveUserData(username, data) {
      localStorage.setItem(`user_${username}`, JSON.stringify(data));
    }
    function register() {
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;
      if (!username || !password) return showMessage("Champs requis");
      if (getUserData(username)) {
        return showMessage("Nom d'utilisateur déjà utilisé");
      }
      const newUser = { password: password, tasks: [] };
      saveUserData(username, newUser);
      showMessage("Compte créé ! Connectez-vous.", "green");
    }
    function login() {
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;
      const userData = getUserData(username);
      if (!userData || userData.password !== password) {
        return showMessage("Identifiants invalides");
      }
      currentUser = username;
      document.getElementById("authContainer").style.display = "none";
      document.getElementById("todoContainer").style.display = "block";
      document.getElementById("welcome").textContent = "Bienvenue, " + username;
      loadTasks();
    }
    function logout() {
      currentUser = null;
      document.getElementById("authContainer").style.display = "block";
      document.getElementById("todoContainer").style.display = "none";
      document.getElementById("taskList").innerHTML = '';
      document.getElementById("username").value = '';
      document.getElementById("password").value = '';
      showMessage("");
    }
    const taskList = document.getElementById('taskList');
    function addTask(text, completed = false) {
      const li = document.createElement('li');
      const textSpan = document.createElement('span');
	  textSpan.textContent = text;
	  li.appendChild(textSpan);
      if (completed) li.classList.add('completed');
      li.addEventListener('click', () => {
        li.classList.toggle('completed');
        saveTasks();
      });
      const deleteBtn = document.createElement('button');
      deleteBtn.textContent = 'Delete';
      deleteBtn.classList.add('delete-btn');
      deleteBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        li.remove();
        saveTasks();
      });
      li.appendChild(deleteBtn);
      taskList.appendChild(li);
    }
    function saveTasks() {
      const tasks = [];
      taskList.querySelectorAll('li').forEach(li => {
        tasks.push({
          text: li.firstChild.textContent,
          completed: li.classList.contains('completed')
        });
      });
      const data = getUserData(currentUser);
      data.tasks = tasks;
      saveUserData(currentUser, data);
    }
    function loadTasks() {
      const data = getUserData(currentUser);
      taskList.innerHTML = '';
      data.tasks.forEach(task => {
        addTask(task.text, task.completed);
      });
    }
    document.getElementById('addTaskBtn').addEventListener('click', () => {
      const taskInput = document.getElementById('taskInput');
      const text = taskInput.value.trim();
      if (!text) return;
      addTask(text);
      taskInput.value = '';
      saveTasks();
    });
    document.getElementById('searchInput').addEventListener('input', (e) => {
      const query = e.target.value.toLowerCase();
      document.querySelectorAll('#taskList li').forEach(li => {
        const text = li.firstChild.textContent.toLowerCase();
        li.style.display = text.includes(query) ? '' : 'none';
      });
    });
  </script>
</body>
</html>
